name: NYC collection watchdog

on:
  schedule:
    - cron: "17 12 * * *"
      timezone: "America/New_York"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch master and gh-pages
        run: |
          git clone --quiet --depth 1 "https://github.com/$GITHUB_REPOSITORY.git" repo
          git -C repo fetch --quiet --depth 5 origin gh-pages:refs/remotes/origin/gh-pages
      - name: Check this billing period's collection and publish
        run: python3 -I repo/nyc/watchdog.py
